appId: pt.petstay.desktop
productName: PetStay
directories:
  output: release
files:
  - dist/**/*
  - dist-desktop/main.cjs
  - package.json
  - '!node_modules/**/*'
asar: true
npmRebuild: false
win:
  icon: desktop/icon.ico
  target:
    - target: portable
      arch: [x64]
  artifactName: PetStay-${version}-windows-x64-portable.exe
  signExecutable: false
portable:
  requestExecutionLevel: user
  unpackDirName: false
