name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm ci
      - run: npm test
      - run: npm run build:windows
      - name: Publish Windows downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = "docs/releases/v$version.md"
          $artifacts = @(
            "release/v$version/PetStay-$version-windows-x64-portable.exe",
            "release/v$version/PetStay-$version-windows-x64-setup.exe",
            "release/v$version/SHA256SUMS.txt"
          )
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release already exists; refusing to replace published downloads'
          }
          if (Test-Path -LiteralPath $notes) {
            gh release create $env:GITHUB_REF_NAME @artifacts --repo $env:GITHUB_REPOSITORY --verify-tag --title "PetStay $version" --notes-file $notes --latest
          } else {
            gh release create $env:GITHUB_REF_NAME @artifacts --repo $env:GITHUB_REPOSITORY --verify-tag --title "PetStay $version" --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
