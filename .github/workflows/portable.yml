name: Portable Windows app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:portable
      - run: npm run test:portable
      - name: Checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem release/*-portable.exe | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($artifact.Name)" | Set-Content -Encoding ascii release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PetStay-windows-x64-portable
          path: |
            release/*-portable.exe
            release/SHA256SUMS.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'This version is already published. The verified CI build remains available as an artifact.'
          } else {
            gh release create $env:GITHUB_REF_NAME release/*-portable.exe release/SHA256SUMS.txt --verify-tag --title "PetStay $env:GITHUB_REF_NAME" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
